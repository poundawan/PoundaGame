<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mission 1 jouable</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE occasion : un jeu de plateau coopératif, nuit de forêt et lanterne
   IDEA la table de jeu : plateau de tuiles au centre, fiche du héros actif à côté, carnet de bord en dessous
   PICTURE la tuile 8x8 dessinée case par case avec figurines, cases jouables surlignées en or
   COLOUR nuit vert profond, mousse, or de lanterne pour l'action, rouge braise pour les créatures
   TYPE Fraunces pour les titres, Nunito Sans pour le jeu
   LAYOUT laptop : plateau à gauche, fiche et actions à droite ; téléphone : barre de lanterne, plateau, actions, journal */
:root{color-scheme:dark;--bg:#0f1c16;--panel:#162a21;--panel2:#1d362b;--line:#2c4a3c;--ink:#eaf3ec;--muted:#a9c2b3;--gold:#f2c14b;--gold2:#ffd97a;--red:#e2675b;--blue:#7fb8d6;--ok:#8fd694}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Nunito Sans",system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:Fraunces,Georgia,serif;letter-spacing:-.01em;margin:0}
button,select,input{font:inherit;color:inherit}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:12px max(16px,3vw);border-bottom:1px solid var(--line);background:#0c1712}
.top h1{font-size:22px}
.lantern{display:flex;align-items:center;gap:10px;flex:1 1 260px}
.lbar{flex:1;height:14px;border-radius:99px;background:#24392f;overflow:hidden;border:1px solid var(--line)}
.lbar>div{height:100%;background:linear-gradient(90deg,#c98b1c,var(--gold2));transition:width .3s}
.lnum{font-weight:800;color:var(--gold);white-space:nowrap}
.pill{border:1px solid var(--line);border-radius:99px;padding:3px 10px;font-size:13px;color:var(--muted);white-space:nowrap}
.main{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;padding:16px max(16px,3vw);align-items:start}
@media(max-width:860px){.main{grid-template-columns:minmax(0,1fr)}}
.boardwrap{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px}
.boardhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;margin:2px 4px 8px}
.boardhead h2{font-size:20px}
#board{display:block;width:100%;height:auto;touch-action:manipulation;user-select:none}
.side{display:flex;flex-direction:column;gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.card h3{font-size:17px;margin-bottom:6px}
.hint{color:var(--muted);font-size:13px;margin:4px 0 0}
.stats{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.stat{background:var(--panel2);border-radius:8px;padding:2px 8px;font-size:13px;white-space:nowrap}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:7px 11px;cursor:pointer;min-height:38px;text-align:left}
.btn:hover:not(:disabled){border-color:var(--gold)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.on{border-color:var(--gold);background:#3a3417}
.btn.main{background:var(--gold);color:#1d1606;border-color:var(--gold);font-weight:800}
.btn small{display:block;color:var(--muted);font-size:12px;line-height:1.3}
.btn.main small{color:#3d300e}
.roster{display:grid;gap:6px}
.hero{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:8px;align-items:center;padding:6px 8px;border-radius:10px;border:1px solid transparent;cursor:pointer}
.hero.cur{border-color:var(--gold);background:#24321f}
.hero.down{opacity:.45}
.dot{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;color:#10170f}
.mini{font-size:12px;color:var(--muted)}
.hp{height:6px;border-radius:9px;background:#3a2a28;overflow:hidden;margin-top:3px}
.hp>div{height:100%;background:var(--ok)}
.log{max-height:260px;overflow:auto;font-size:13px;display:flex;flex-direction:column-reverse}
.log p{margin:0;padding:3px 0;border-bottom:1px dashed #23392e}
.log .r{color:var(--gold2)}
.log .bad{color:var(--red)}
.log .good{color:var(--ok)}
.log .story{color:#cfe3d6;font-style:italic}
.overlay{position:fixed;inset:0;background:rgba(5,10,8,.82);display:grid;place-items:center;padding:16px;z-index:5;overflow:auto}
.dialog{background:var(--panel);border:1px solid var(--gold);border-radius:16px;padding:18px;max-width:760px;width:100%}
.dialog h2{font-size:26px;margin-bottom:6px}
.setup{display:grid;gap:8px;margin:12px 0}
.srow{display:grid;grid-template-columns:minmax(0,1.1fr) repeat(3,minmax(0,1fr));gap:6px}
@media(max-width:560px){.srow{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
select,input{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:7px 8px;font-size:16px;width:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted);margin:8px 4px 0}
.legend span{display:inline-flex;align-items:center;gap:5px}
.sw{width:12px;height:12px;border-radius:3px;display:inline-block}
.simbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px max(16px,3vw);background:#1b2f25;border-bottom:1px solid var(--line)}
.simbar input[type=range]{flex:1 1 200px;accent-color:#f2c14b;padding:0;border:0;background:none}
.simbar .lab{font-size:13px;color:var(--muted);white-space:nowrap}
.sumt{width:100%;border-collapse:collapse;font-size:14px;margin-top:8px}
.sumt td,.sumt th{padding:5px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tip{font-size:13px;color:var(--gold2);min-height:20px;margin:6px 4px 0}
@media(prefers-reduced-motion:reduce){.lbar>div{transition:none}}
</style>
</head>
<body>
<header class="top">
<h1>Mission 1 · La Lisière</h1>
<div class="lantern"><span title="Charges du grand Lumignon">🏮</span><div class="lbar"><div id="lfill"></div></div><span class="lnum" id="lnum">30</span></div>
<span class="pill" id="mode">Exploration</span>
<button class="btn" id="newgame" type="button">Nouvelle partie</button>
</header>
<div class="simbar" id="simbar" hidden></div>
<div class="main">
<section class="boardwrap">
<div class="boardhead"><h2 id="tilename">—</h2><span class="pill" id="tilerole">—</span></div>
<svg id="board" viewBox="0 0 500 500" role="img" aria-label="Plateau de la tuile en cours"></svg>
<p class="tip" id="tip"></p>
<div class="legend" id="legend"></div>
</section>
<aside class="side">
<div class="card" id="active"></div>
<div class="card"><h3>Le groupe</h3><div class="roster" id="roster"></div></div>
<div class="card" id="foes"></div>
<div class="card"><h3>Journal</h3><div class="log" id="log"></div></div>
</aside>
</div>
<div class="overlay" id="overlay" hidden><div class="dialog" id="dialog"></div></div>
<script>
{
/* ================= Données ================= */
const TILES={
 t1:{name:'Lisière du Voile',role:'Départ',g:['TTTTTTTT','T..F...T','T.P...FT','HHA.....','HH......','T...F..T','TF....TT','TTTTTTTT'],exits:{E:'t2'},
  story:'La route lanternée s’arrête ici. Devant vous, la brume avale les arbres. Le grand Lumignon s’élève et vous suit.',clue:'Une inscription griffée par d’anciens Explorateurs : « Ne suivez pas la lumière qui attend. »'},
 t2:{name:'Sous-bois aux fougères',role:'Exploration',g:['TTTTTTTT','T.FFP.FT','T.TTT..T','......F.','.F......','T..TTT.T','TF....FT','TTTTTTTT'],exits:{E:'t3'},event:'chenilles',
  story:'Deux troncs couchés forment des couloirs de fougères. Quelque chose bruisse sous les feuilles.'},
 t3:{name:'Gué du ruisseau',role:'Exploration',g:['TTTOOTTT','T..OO..T','T.ROO.PT','...WW...','...WW...','T..OO.RT','TF.OO..T','TTTOOTTT'],exits:{E:'t4'},
  secret:{nom:'la Grotte sous le gué',niveau:3,danger:'☠☠'},story:'Un ruisseau noir coupe la forêt. Seul un gué de pierres plates permet de passer.'},
 t4:{name:'Ruines envahies',role:'Combat · embranchement',g:['MMM..MMM','M..S...M','M.MM.M.M','...A.S..','........','M.M..MMM','M.S...PM','MMMMMMMM'],exits:{N:'t5',E:'t6'},hidden:true,fight:'ruines',
  story:'Des murs couverts de lierre. Au centre, un autel éteint. Des chenilles luisantes sortent des fissures !'},
 t5:{name:'Saulaie brumeuse',role:'Raccourci · brume épaisse',g:['TTTTTTTT','TD..S.DT','T.T.DT.T','T.D.P...','TF..D...','T.T.DT.T','TD....DT','TTT..TTT'],exits:{E:'t7'},brume:true,fight:'saulaie',
  secret:{nom:'la Racine-Mère',niveau:10,danger:'☠☠☠☠☠'},story:'La brume est si épaisse que le Lumignon peine. Des racines partout, et des battements d’ailes au-dessus.'},
 t6:{name:'Champignonnière aux fleurs-lanternes',role:'Détour',g:['TTT..TTT','T.K..L.T','T...K..T','..L..V.T','......LT','T......T','TL....PT','TTTTTTTT'],exits:{N:'t7'},fight:'champi',
  story:'Des champignons géants, des spores dorées… et des fleurs qui brillent comme de petites lanternes.'},
 t7:{name:'Clairière du Lumivore',role:'Boss',g:['TTTTTTTT','TOOOOOOT','TOGZZOOT','..DZZD.T','..D..D.T','T.*..*.T','TF....FT','TTT..TTT'],exits:{},fight:'boss',
  story:'Une lumière dorée flotte au-dessus de la mare. Ce n’est pas un Lumignon. La mare remue.'}
};
const ENTRY={O:[[0,3],[0,4]],E:[[7,3],[7,4]],N:[[3,0],[4,0]],S:[[3,7],[4,7]]};
const OPP={E:'O',O:'E',N:'S',S:'N'};
const DIRN={E:'est',O:'ouest',N:'nord',S:'sud'};
const COL={'.':'#a9c98a',T:'#2f5b3a',R:'#8d8a80',M:'#9b8f7a',F:'#6fa25a',D:'#8a6a45',W:'#7fb8d6',O:'#3f7fa8',P:'#c9a24a',A:'#d9b35a',L:'#f2c14b',S:'#a9c98a',K:'#a9c98a',V:'#a9c98a',H:'#d8d1bc',Z:'#355446',G:'#a9c98a','*':'#c8d7e8'};
const CLASSES={
 rempart:{n:'Rempart',pv:12,def:3,mai:10,ecl:4,inst:9,c:'#9fb7d9',sp:['bouclier','armure','riposte']},
 tisseur:{n:'Tisseur',pv:9,def:1,mai:11,ecl:6,inst:11,c:'#f2d07a',sp:['lienvie','lienforce','lienleger']},
 lamesort:{n:'Lamesort',pv:10,def:2,mai:12,ecl:5,inst:9,c:'#f08a6c',sp:['lame','marteau','lance']},
 pisteur:{n:'Pisteur',pv:9,def:1,mai:12,ecl:5,inst:11,c:'#9ed38a',sp:['arc','cible','piege']},
 elementaliste:{n:'Élémentaliste',pv:7,def:0,mai:12,ecl:7,inst:10,c:'#e59ad6',sp:['etincelle','flocon','decharge','gravillons']},
 passeombre:{n:'Passe-Ombre',pv:9,def:2,mai:11,ecl:5,inst:11,c:'#b59cf0',sp:['lameombre','pasombre','echange']}};
const RACES={humain:{n:'Humain',t:'+1 en fouille ; étudie les Curiosités'},marque:{n:'Marqué',t:'Atout du familier 2 fois par combat'},saurien:{n:'Saurien',t:'Apnée : 5 de Souffle'},
 oiseau:{n:'Peuple-oiseau',t:'Déplacement 4, racines et eau peu profonde à 1'},loutre:{n:'Loutre',t:'Nage : eau à 1, eau profonde à 2'},astreen:{n:'Astréen',t:'Voit les secrets du Voile'}};
const FAMS={gecko:{n:'Gecko',m:'Passe-muraille : fouille un point de fouille à distance (exploration)',a:'Éclat aveuglant : créatures à 2 cases −3 à l’attaque ce round'},
 hibou:{n:'Hibou',m:'Vigie : regarde ce qui attend derrière une sortie (exploration)',a:'Piqué : +2 à la prochaine attaque'},
 lynx:{n:'Lynx',m:'Bond : d4 à une créature à 4 cases, elle attaque le Lynx à son tour',a:'Insaisissable : −2 pour être touché jusqu’au prochain tour'},
 chacal:{n:'Chacal',m:'Chasseur : mord une créature à 4 cases (d4)',a:'Morsure : +d4 à la prochaine attaque réussie'},
 tatou:{n:'Tatou',m:'Gardien : bloque une case à 4 cases jusqu’à la fin du round',a:'Carapace : aucun dégât ce round, mais ne bouge plus'},
 panda:{n:'Panda',m:'Berceuse : endort une créature à 4 cases 1 round (pas le boss)',a:'Rêve partagé : lui et un allié à 2 cases regagnent 1 Éclat'}};
const SP={
 bouclier:{n:'Coup de bouclier',c:1,r:1,t:'foe',d:6,txt:'corps à corps, d6'},
 armure:{n:'Armure de force',c:1,r:1,t:'allyself',txt:'+2 Défense tout le combat (une seule active)'},
 riposte:{n:'Riposte',c:1,r:0,t:'self',txt:'jusqu’à ton prochain tour, tout attaquant au contact subit d4'},
 lienvie:{n:'Lien de vie',c:1,r:4,t:'any',d:6,txt:'soigne d6 un allié ou inflige d6 à une créature'},
 lienforce:{n:'Lien de force',c:1,r:4,t:'ally',txt:'+2 aux attaques d’un allié tout le combat (un seul)'},
 lienleger:{n:'Lien léger',c:1,r:4,t:'allyself',txt:'+1 case par déplacement jusqu’à la fin du round suivant'},
 lame:{n:'Lame',c:1,r:1,t:'foe',d:8,txt:'corps à corps, d8'},
 marteau:{n:'Marteau',c:1,r:1,t:'foe',d:6,txt:'d6, repousse de 2 cases, la cible ne bougera pas'},
 lance:{n:'Lance',c:1,r:2,t:'line',d:6,txt:'d6 aux créatures alignées sur 2 cases'},
 arc:{n:'Arc de lumière',c:1,r:6,t:'foe',d:6,txt:'distance 6, d6'},
 cible:{n:'Cible illuminée',c:1,r:6,t:'foeauto',txt:'+1 pour toucher la cible pour tous, jusqu’à sa chute'},
 piege:{n:'Piège runique',c:1,r:3,t:'cell',txt:'la 1re créature qui entre subit d8 et ne bouge plus 1 round'},
 etincelle:{n:'Étincelle',c:1,r:6,t:'foe',d:6,txt:'distance 6, d6'},
 flocon:{n:'Flocon',c:1,r:5,t:'foe',d:4,txt:'d4 et −1 déplacement au prochain tour'},
 decharge:{n:'Décharge',c:1,r:5,t:'foe',d:4,txt:'d4, puis d4 à une 2e créature à 2 cases'},
 gravillons:{n:'Gravillons',c:1,r:5,t:'area',d:4,txt:'zone 2 × 2 : d4 à chaque créature touchée'},
 lameombre:{n:'Lame d’ombre',c:1,r:2,t:'foe',d:6,txt:'portée 2, d6'},
 pasombre:{n:'Pas d’ombre',c:1,r:4,t:'tele',txt:'téléportation à 4 cases, à travers tout'},
 echange:{n:'Échange d’ombres',c:1,r:4,t:'swap',txt:'échange ta place avec un allié ou une créature'}};
const CRE={chenille:{n:'Chenille de lueur',att:9,def:0,pv:3,dmg:4,mv:3,xp:1,c:'#e8e2ff'},phalene:{n:'Phalène mange-lumière',att:12,def:1,pv:5,dmg:4,mv:5,xp:4,fly:1,c:'#8ea0c8'},
 cracheur:{n:'Cracheur de spores',att:11,def:2,pv:5,dmg:4,mv:0,xp:3,rng:3,c:'#5f9a8c'},vesse:{n:'Vesse-de-loup',att:0,def:0,pv:4,dmg:6,mv:0,xp:2,c:'#e09a5a'},
 blaireau:{n:'Blaireau des souches',att:13,def:3,pv:13,dmg:8,mv:4,xp:6,c:'#6b5a46'},lumivore:{n:'Lumivore',att:12,def:3,pv:23,dmg:6,mv:0,xp:15,boss:1,c:'#2c5a46'},
 leurre:{n:'Leurre',att:0,def:5,pv:6,dmg:0,mv:0,xp:3,fixed:1,c:'#ffd35c'}};
// PV des créatures selon le nombre de héros (2, 3, 4, 5) : table du bestiaire, issue des simulations
const PVT={chenille:[3,3,5,7],phalene:[4,5,9,11],cracheur:[4,5,9,11],vesse:[3,4,7,9],blaireau:[11,14,22,29],lumivore:[20,31,55,78]};
const DECK0=['seve','seve','seve','seve','seve','cristal','cristal','cristal','cristal','eclat','eclat','eclat','eclat','bulle','bulle','talisman','bottes','pierre','bourse','curio','curio','curio','curio'];
const ITEMS={soin:'Potion de soin (+6 PV)',souffle:'Potion de second souffle (tous les Éclats)',seve:'Sève de lune (d6 PV)',cristal:'Cristal de lumière (+2 charges)',eclat:'Éclat brut (+2 Éclats)',bulle:'Bulle d’air (Souffle)',curio:'Curiosité du Voile',
 talisman:'Talisman d’écorce (+1 Défense)',bottes:'Bottes de mousse (+1 case)',pierre:'Pierre-focus (+1 Maîtrise)',bourse:'Bourse à éclats (+1 Éclat de réserve)'};
const EQUIP=['talisman','bottes','pierre','bourse'];

/* ================= Outils ================= */
let G=null;
const $=(id)=>document.getElementById(id);
const esc=(s)=>String(s).replace(/[&<>"']/g,(m)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const d=(n)=>1+Math.floor(Math.random()*n);
const man=(a,b)=>Math.abs(a.x-b.x)+Math.abs(a.y-b.y);
const key=(x,y)=>x+','+y;
function log(t,cls){G.log.push({t,cls:cls||''});}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const tile=()=>TILES[G.tile];
const cell=(x,y)=>(x<0||y<0||x>7||y>7)?'#':tile().g[y][x];
const heroes=()=>G.units.filter((u)=>u.side==='h');
const alive=(s)=>G.units.filter((u)=>u.side===s&&!u.down&&u.pv>0);
const byId=(id)=>G.units.find((u)=>u.id===id);
function cellsOf(u){return u.big?[[u.x,u.y],[u.x+1,u.y],[u.x,u.y+1],[u.x+1,u.y+1]]:[[u.x,u.y]];}
function unitAt(x,y){return G.units.find((u)=>!u.down&&u.pv>0&&cellsOf(u).some(([a,b])=>a===x&&b===y));}
function dist(a,b){let m=99;for(const[ax,ay]of cellsOf(a))for(const[bx,by]of cellsOf(b))m=Math.min(m,Math.abs(ax-bx)+Math.abs(ay-by));return m;}
function solid(ch){return 'TRM#'.includes(ch);}
function stepCost(u,ch){
 if(u.fly)return solid(ch)?99:1;
 if(solid(ch)||ch==='Z')return 99;
 if(ch==='O')return u.race==='loutre'?2:99;
 if(ch==='W')return (u.race==='loutre'||u.race==='oiseau')?1:2;
 if(ch==='D')return u.race==='oiseau'?1:2;
 return 1;}
function reach(u,mp){
 const res=new Map();res.set(key(u.x,u.y),0);const q=[[u.x,u.y,0]];
 while(q.length){q.sort((a,b)=>a[2]-b[2]);const[x,y,c]=q.shift();
  for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){const nx=x+dx,ny=y+dy;const ch=cell(nx,ny);if(ch==='#')continue;
   const sc=stepCost(u,ch);if(sc>=99)continue;const nc=c+sc;if(nc>mp)continue;
   const o=unitAt(nx,ny);if(o&&o.side!==u.side)continue;
   if(u.side==='c'&&G.blocks.includes(key(nx,ny)))continue;
   if(!res.has(key(nx,ny))||res.get(key(nx,ny))>nc){res.set(key(nx,ny),nc);q.push([nx,ny,nc]);}}}
 for(const k of [...res.keys()]){const[x,y]=k.split(',').map(Number);const o=unitAt(x,y);if(o&&o!==u)res.delete(k);}
 return res;}
function bfsField(tx,ty,u){ // distance à pied depuis la cible (ignore les unités)
 const f=new Map();f.set(key(tx,ty),0);const q=[[tx,ty]];
 while(q.length){const[x,y]=q.shift();const c=f.get(key(x,y));
  for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){const nx=x+dx,ny=y+dy;const ch=cell(nx,ny);if(ch==='#')continue;if(stepCost(u,ch)>=99)continue;
   if(!f.has(key(nx,ny))){f.set(key(nx,ny),c+1);q.push([nx,ny]);}}}
 return f;}
function roll(score,label){const r=d(20);const ok=r===1||(r!==20&&r<=score);log(`${label} : d20 = ${r} ${ok?'≤':'>'} ${score} → ${ok?'réussi':'raté'}`,'r');return ok;}

/* ================= Mise en place ================= */
function newGame(cfg){
 const n=cfg.length;
 G={tile:'t1',from:null,mode:'explore',round:0,charge:(TUNE.start??32),log:[],units:[],order:[],turn:0,acts:0,sel:null,pending:null,deck:shuffle(DECK0.slice()),searched:{},flowers:0,
  armor:{},force:{},illum:{},traps:[],blocks:[],dark:0,phase2:false,diving:false,visited:{},carnet:[],xp:{},altar:false,over:null,chest:false,peek:null,uid:1,stats:{tiles:[],fights:[],kills:{},items:[],secrets:0}};
 cfg.forEach((h,i)=>{const C=CLASSES[h.cls];const duo=n===2;

function startCombat(){

  if(G.turn>=G.order.length){voilePhase();if(G.over||G.mode!=='combat')return;G.round++;G.turn=0;}

function startHeroTurn(h){
 G.sel=h.id;G.acts=2;h.e=Math.min(h.e0,h.e+1);if(!TUNE.riposteLong)h.riposte=false;h.dodge=false;h.moved=false;

function attackScore(h,t){let s=h.mai-h.malus-t.def;
 if(Object.entries(G.force).some(([c,id])=>id===h.id&&byId(c)&&!byId(c).down))s+=2;

 if(h.hitb){s+=h.hitb;}
 if(h.cls==='rempart'&&TUNE.ramp&&G.mode==='combat')s+=Math.min(TUNE.ramp,G.round-1);

  t.pv-=n;if(G.stats){G.stats.dmgTaken=(G.stats.dmgTaken||0)+n;const r=Math.max(0,t.pv)/t.pv0;G.stats.minR=Math.min(G.stats.minR??1,r);if(r<=0.25)G.stats.close=(G.stats.close||0)+1;}log(`${t.name} perd ${n} PV (${Math.max(0,t.pv)}/${t.pv0}).`,'bad');if(t.pv<=0){t.pv=0;t.down=true;log(`${t.name} est à terre !`,'bad');}return;}
 t.pv-=n;log(`${t.name} perd ${n} PV (${Math.max(0,t.pv)}/${t.pv0}).`,'good');
 if(t.pv<=0)kill(t,src);
 else if(t.kind==='lumivore'&&!G.phase2&&t.pv<=t.pv0/2){G.phase2=true;G.diving=true;log('Le Lumivore plonge dans le mycélium ! La clairière s’assombrit, des champignons poussent.','bad');
  G.dark=2;tile().g.forEach((r,y)=>[...r].forEach((c,x)=>{if(c==='*'&&!unitAt(x,y))spawn('cracheur',x,y);}));}}
function kill(t,src){t.pv=0;log(`${t.name} est vaincu.`,'good');
 if(src&&src.side==='h'){G.xp[src.id]+=CRE[t.kind].xp;G.stats.kills[src.id]=(G.stats.kills[src.id]||0)+1;}
 if(t.kind==='vesse'){log('La Vesse-de-loup explose !','bad');const dmg=d(6);G.units.filter((u)=>u!==t&&u.pv>0&&!u.down&&dist(u,t)===1).forEach((u)=>hurt(u,dmg,null));}
 if(t.kind==='blaireau')gainItem(drawEquip(),src&&src.side==='h'?src:alive('h')[0],'Le Blaireau laisse');

 if(t.kind==='lumivore'){G.units.filter((u)=>u.side==='c').forEach((u)=>{u.pv=0;});gainItem(drawEquip(),alive('h')[0],'Le Lumivore laisse');gainItem(drawEquip(),alive('h')[1]||alive('h')[0],'Le Lumivore laisse');}
 G.units=G.units.filter((u)=>u.side==='h'||u.pv>0);

 if(G.charge<=0){G.charge=0;const F=G.stats&&G.mode==='combat'?G.stats.fights[G.stats.fights.length-1]:null;if(F&&!F.rounds)F.rounds=G.round;G.over='defaite';log('Le Lumignon s’éteint. Les Explorateurs battent en retraite.','bad');return true;}

 return false;}

function heroAttack(h,t,die,label){

 if(sid==='armure'){G.armor[h.id]=tgt.id;log(`${h.name} entoure ${tgt.name} d’une Armure de force (+2 Défense).`,'good');}
 else if(sid==='riposte'){h.riposte=true;log(`${h.name} se met en Riposte.`,'good');}
 else if(sid==='lienforce'){G.force[h.id]=tgt.id;log(`${h.name} tisse un Lien de force vers ${tgt.name} (+2 aux attaques).`,'good');}

 else if(sid==='lienvie'){if(tgt.side==='h'){const v=d(6);tgt.pv=Math.min(tgt.pv0,tgt.pv+v);log(`Lien de vie : ${tgt.name} regagne ${v} PV.`,'good');}else heroAttack(h,tgt,6,'Lien de vie');}

 else if(sid==='marteau'){if(heroAttack(h,tgt,6,'Marteau')&&tgt.pv>0&&!tgt.big&&tgt.kind!=='leurre'){const dx=Math.sign(tgt.x-h.x),dy=Math.sign(tgt.y-h.y);
   for(let i=0;i<2;i++){const nx=tgt.x+dx,ny=tgt.y+dy;const ch=cell(nx,ny);if(solid(ch)||'OZ#'.includes(ch)||unitAt(nx,ny))break;tgt.x=nx;tgt.y=ny;}tgt.stuck=1;log(`${tgt.name} est repoussé et sonné.`,'');}}

 else if(sid==='decharge'){heroAttack(h,tgt,4,'Décharge');const o=alive('c').filter((u)=>u!==tgt&&dist(u,tgt)<=2).sort((a,b)=>dist(a,tgt)-dist(b,tgt))[0];if(o){log('L’éclair rebondit…','');heroAttack(h,o,4,'Rebond');}}
 else if(sid==='gravillons'){const[x,y]=tgt;const hit=new Set();[[x,y],[x+1,y],[x,y+1],[x+1,y+1]].forEach(([a,b])=>{const u=unitAt(a,b);if(u&&u.side==='c')hit.add(u);});
   if(!hit.size)log('Les gravillons ne touchent personne.','');[...hit].forEach((u)=>heroAttack(h,u,4,'Gravillons'));}

/* ================= Phase du Voile ================= */
function voilePhase(){
 log('— Phase du Voile —','bad');
 const boss=alive('c').find((c)=>c.kind==='lumivore');const leurre=alive('c').find((c)=>c.kind==='leurre');
 for(const c of alive('c').slice()){
  if(G.over)return;if(c.pv<=0)continue;
  if(c.kind==='vesse'||c.kind==='leurre')continue;
  if(c.sleep){c.sleep=0;log(`${c.name} dort.`,'');continue;}
  if(c.kind==='lumivore'){bossTurn(c,leurre);continue;}
  const hs=alive('h');if(!hs.length)return;
  if(c.lured){const owner=byId(c.lured);c.lured=null;if(owner&&!owner.down){if(roll(c.att-2,`${c.name} attaque le Lynx de ${owner.name}`)){owner.famRest=G.round+1;log('Le Lynx est touché : il se repose un round.','bad');}continue;}}
  let tgt;
  if(c.kind==='blaireau'&&G.round%2===0){tgt=hs.slice().sort((a,b)=>a.pv-b.pv)[0];const spot=[[1,0],[-1,0],[0,1],[0,-1]].map(([dx,dy])=>[tgt.x+dx,tgt.y+dy]).find(([x,y])=>{const ch=cell(x,y);return !solid(ch)&&!'OZ#'.includes(ch)&&!unitAt(x,y);});
   if(spot){c.x=spot[0];c.y=spot[1];log('Le Blaireau s’enterre et ressort à côté de '+tgt.name+' !','bad');}}
  else if(c.kind==='cracheur'){const inr=hs.filter((h)=>dist(h,c)<=3);if(!inr.length)continue;tgt=inr.sort((a,b)=>dist(a,c)-dist(b,c)||a.pv-b.pv)[0];}
  else{tgt=hs.slice().sort((a,b)=>dist(a,c)-dist(b,c)||a.pv-b.pv)[0];
   if(dist(c,tgt)>1&&!c.stuck){const mp=Math.max(0,c.mv-(c.slow?1:0));const R=reach(c,mp);const F=bfsField(tgt.x,tgt.y,c);let best=null,bv=1e9;
    R.forEach((cost,k)=>{const[x,y]=k.split(',').map(Number);const v=(F.has(k)?F.get(k):40+Math.abs(x-tgt.x)+Math.abs(y-tgt.y))*10+cost;if(v<bv){bv=v;best=[x,y];}});
    if(best){c.x=best[0];c.y=best[1];const tr=G.traps.findIndex((t)=>t.x===c.x&&t.y===c.y);
     if(tr>=0){G.traps.splice(tr,1);log(`${c.name} déclenche un Piège runique !`,'good');hurt(c,d(8),null);if(c.pv<=0)continue;c.stuck=2;}}}}
  c.slow=0;if(c.stuck)c.stuck--;
  if(!tgt||c.pv<=0)continue;
  const reachA=c.kind==='cracheur'?3:1;if(dist(c,tgt)>reachA)continue;
  creatureAttack(c,tgt);}
 if(G.over)return;
 // entretien de la lumière
 let loss=1+(tile().brume?1:0);if(leurre&&leurre.pv>0&&boss&&boss.pv>0){loss++;log('Le leurre dévore la lumière : −1 charge.','bad');}
 if(G.dark>0){loss++;G.dark--;log('La clairière est plongée dans le noir : −1 charge.','bad');}
 G.charge-=loss;log(`Le Lumignon perd ${loss} charge${loss>1?'s':''} (reste ${Math.max(0,G.charge)}).`,'');
 if(G.charge>0&&G.charge<=3)log('« Le Lumignon vacille… »','bad');
 G.blocks=[];alive('c').forEach((c)=>{c.blind=0;});alive('h').forEach((h)=>{if(h.light>0)h.light--;h.malus=h.malusNext||0;h.malusNext=0;});
 checkEnd();}
function creatureAttack(c,t){

function bossTurn(b,leurre){
 if(G.diving){G.diving=false;log('Le Lumivore reste sous le mycélium…','');return;}

  if(!roll(farH.inst,`${farH.name} résiste à l’attraction du leurre (Instinct)`)){const F=bfsField(b.x,b.y,farH);
   for(let i=0;i<2;i++){const opts=[[1,0],[-1,0],[0,1],[0,-1]].map(([dx,dy])=>[farH.x+dx,farH.y+dy]).filter(([x,y])=>!unitAt(x,y)&&stepCost(farH,cell(x,y))<99).sort((p,q)=>(F.get(key(p[0],p[1]))??99)-(F.get(key(q[0],q[1]))??99));
    if(opts[0]){farH.x=opts[0][0];farH.y=opts[0][1];}}log(`${farH.name} avance, fasciné, vers la lumière.`,'bad');}}
 const inr=hs.filter((h)=>dist(h,b)<=4);if(!inr.length){log('Le Lumivore guette, immobile.','');return;}
 const t=inr.sort((a,c)=>a.pv-c.pv)[0];
 if(roll(b.att-t.def-(Object.values(G.armor).includes(t.id)?(TUNE.armor??2):0)-(t.dodge?2:0)-(b.blind?3:0),`Langue du Lumivore sur ${t.name}`)){hurt(t,d(6),b);
  if(!t.down&&dist(t,b)>1){const spot=freeCells((x,y)=>dist({x,y},b)===1&&stepCost(t,cell(x,y))<99).sort((p,q)=>(Math.abs(p[0]-t.x)+Math.abs(p[1]-t.y))-(Math.abs(q[0]-t.x)+Math.abs(q[1]-t.y)))[0];
   if(spot){t.x=spot[0];t.y=spot[1];log(`${t.name} est tiré contre le Lumivore !`,'bad');}}}}

function targetsFor(h,S,sid){
 const out=[];const R=S.r;if(S.t==='self')return [h];

 if(S.t==='swap'){G.units.forEach((u)=>{if(u!==h&&u.pv>0&&!u.down&&!u.big&&u.kind!=='leurre'&&dist(h,u)<=R)out.push(u);});}
 if(S.t==='cell'||S.t==='tele'){freeCells((x,y)=>Math.abs(x-h.x)+Math.abs(y-h.y)<=R).forEach((p)=>out.push(p));}
 if(S.t==='area'){for(let y=0;y<7;y++)for(let x=0;x<7;x++){if(Math.abs(x-h.x)+Math.abs(y-h.y)<=R)out.push([x,y]);}}
 return out;}

 if(!P){const u=unitAt(x,y);if(u&&u.side==='h'&&G.mode==='explore'){G.sel=u.id;render();}return;}
 const h=curHero();
 if(P.type==='move'){const k=key(x,y);if(!P.cells.has(k))return;h.x=x;h.y=y;G.pending=null;if(G.mode==='combat'){G.acts--;h.moved=true;afterAction();}else render();return;}
 const match=P.targets.find((t)=>Array.isArray(t)?(t[0]===x&&t[1]===y):cellsOf(t).some(([a,b])=>a===x&&b===y));

function bestAttack(h){ // meilleur sort offensif disponible : [sid, cible, valeur]
 let best=null;
 for(const sid of CLASSES[h.cls].sp){const S=SP[sid];if(h.e<S.c)continue;
  if(!['foe','line','area','any'].includes(S.t))continue;if(sid==='lienvie')continue;
  const ts=targetsFor(h,S,sid);
  for(const t of ts){let v=0;
   if(S.t==='area'){const[x,y]=t;let n=0;[[x,y],[x+1,y],[x,y+1],[x+1,y+1]].forEach(([a,b])=>{const u=unitAt(a,b);if(u&&u.side==='c')n++;});if(n<2)continue;v=n*2.5;}
   else{if(t.side!=='c')continue;const sc=Math.max(1,Math.min(19,attackScore(h,t)))/20;v=sc*((S.d||4)/2+0.5+h.dmgb);if(t.pv<=(S.d||4))v+=1.5;if(t.kind==='leurre')v+=2;if(t.kind==='vesse'&&dist(h,t)===1)v-=3;
    if(sid==='decharge'&&alive('c').some((o)=>o!==t&&dist(o,t)<=2))v*=1.8;if(sid==='lance'){const dx=Math.sign(t.x-h.x),dy=Math.sign(t.y-h.y);let n=0;for(let i=1;i<=2;i++){const u=unitAt(h.x+dx*i,h.y+dy*i);if(u&&u.side==='c')n++;}v*=n;}
    if(sid==='marteau'&&t.kind!=='lumivore')v+=0.3;}
   if(!best||v>best[2])best=[sid,t,v];}}
 if(h.cls==='tisseur'&&h.e>=1){const ts=alive('c').filter((c)=>dist(h,c)<=4);ts.forEach((t)=>{const v=Math.max(1,attackScore(h,t))/20*3.5;if(!best||v>best[2])best=['lienvie',t,v];});}
 return best;}
function aiAtout(h){const F=h.fam;const maxA=h.race==='marque'?2:1;if(h.atout>=maxA)return false;
 const near=alive('c').filter((c)=>dist(c,h)<=2).length;
 if(F==='gecko'&&near>=2)return true;if(F==='tatou'&&h.pv<=0.5*h.pv0&&near>=1)return true;if(F==='lynx'&&h.pv<=0.6*h.pv0&&near>=1)return true;
 if(F==='chacal'||F==='hibou')return alive('c').some((c)=>dist(c,h)<=6);if(F==='panda'&&h.e<=1)return true;return false;}
function aiMoveCell(h){
 const R=reach(h,h.mv+(h.light?1:0));const cs=alive('c').filter((c)=>!(c.kind==='lumivore'&&G.diving));if(!cs.length)return null;
 const melee=['rempart','lamesort'].includes(h.cls);const range=melee?1:(h.cls==='passeombre'?2:Math.max(...CLASSES[h.cls].sp.map((x)=>SP[x].r).filter((r)=>r>1)));
 let best=null,bv=1e9;R.forEach((c,k)=>{const[x,y]=k.split(',').map(Number);const p={x,y};const dmin=Math.min(...cs.map((u)=>dist(p,u)));
  let v;if(melee)v=dmin*10+c;else{v=(dmin<=range?0:(dmin-range)*10)+(dmin<=1?6:0)-Math.min(dmin,range)+c*0.2;}
  if(cell(x,y)==='F'&&!melee)v-=1;if(v<bv){bv=v;best=[x,y];}});
 if(!best||(best[0]===h.x&&best[1]===h.y))return null;return best;}
function aiCombatStep(){
 const h=curHero();if(!h||h.down){nextHero();return;}
 if(G.acts<=0){nextHero();return;}
 if(aiAtout(h)){useAtout(h);return;}
 if(h.pv<=0.4*h.pv0){const it=['soin','seve'].find((i)=>h.bag.includes(i));if(it){useItem(h,it);return;}}
 if(h.e<=0){const it=['eclat'].find((i)=>h.bag.includes(i))||((G.tile==='t7'||alive('c').length>=4)&&h.bag.includes('souffle')?'souffle':null);if(it){useItem(h,it);return;}}
 // soutiens
 if(h.e>=1){
  if(h.cls==='tisseur'){const hurtA=alive('h').filter((u)=>u.pv<=0.5*u.pv0&&dist(u,h)<=4).sort((a,b)=>a.pv-b.pv)[0];if(hurtA){castSpell(h,'lienvie',hurtA);return;}
   if(!G.force[h.id]||!byId(G.force[h.id])||byId(G.force[h.id]).down){const al=alive('h').filter((u)=>u!==h&&dist(u,h)<=4).sort((a,b)=>CLASSES[b.cls].mai-CLASSES[a.cls].mai)[0];if(al&&alive('c').length>=2){castSpell(h,'lienforce',al);return;}}}
  if(h.cls==='rempart'){const adj=alive('c').filter((c)=>dist(c,h)===1).length;if(adj>=(TUNE.riposteLong?1:2)&&!h.riposte){castSpell(h,'riposte',h);return;}
   if(!G.armor[h.id]||!byId(G.armor[h.id])||byId(G.armor[h.id]).down){const al=alive('h').filter((u)=>dist(u,h)<=1).sort((a,b)=>a.def-b.def)[0];if(al){castSpell(h,'armure',al);return;}}}
  if(h.cls==='pisteur'&&!G.illum[h.id]){const big=alive('c').find((c)=>(c.kind==='blaireau'||c.kind==='lumivore')&&dist(c,h)<=6&&!G.diving);if(big){castSpell(h,'cible',big);return;}}}
 const atk=bestAttack(h);if(atk&&atk[2]>0.2){castSpell(h,atk[0],atk[1]);return;}
 const F=h.fam;if(['lynx','chacal','panda'].includes(F)&&h.famRound!==G.round&&h.famRest<G.round){const ts=famTargets(h);if(ts.length){const t=F==='panda'?ts.sort((a,b)=>b.att-a.att)[0]:ts.sort((a,b)=>a.pv-b.pv)[0];famMission(h,t);return;}}
 if(!h.immune&&!h.aiMoved){const c=aiMoveCell(h);if(c){h.x=c[0];h.y=c[1];G.acts--;h.aiMoved=true;log(`${h.name} se déplace.`,'');afterAction();return;}}
 nextHero();render();}
function aiExploreStep(){
 const T=tile();const hs=alive('h');
 for(const h of hs){
  if(searchPoints(h.id).length){doSearch(h,false);return;}
  if(h.fam==='gecko'&&searchPoints('g'+h.id).length){doSearch(h,true);return;}
  if(T.g.some((r)=>r.includes('A'))&&((G.tile==='t4'&&!G.altar)||(G.tile==='t1'&&!G.altarT1))){G.sel=h.id;const b={dataset:{act:'altar'}};h.free=false;if(G.tile==='t1'){G.altarT1=true;log('La borne s’allume une dernière fois.','story');}else{G.altar=true;log('L’autel s’éveille : deux chemins apparaissent, au nord et à l’est.','story');}render();return;}

  if(h.cls==='tisseur'&&h.e>=1){const t=hs.filter((u)=>u.pv<=0.7*u.pv0).sort((a,b)=>a.pv/a.pv0-b.pv/b.pv0)[0];if(t){h.e--;h.free=false;const v=d(6);t.pv=Math.min(t.pv0,t.pv+v);log(`${h.name} tisse un Lien de vie vers ${t.name} : +${v} PV.`,'good');render();return;}}
  if(h.pv<=0.5*h.pv0&&h.bag.includes('seve')){useItem(h,'seve');return;}
  if(h.race==='humain'&&h.bag.includes('curio')){useItem(h,'curio');return;}}
 const ex=Object.keys(T.exits);if(!ex.length)return;
 const avgE=hs.reduce((a,h)=>a+h.e/h.e0,0)/hs.length;
 const hurtG=hs.some((h)=>h.pv<=0.5*h.pv0)||hs.reduce((a,h)=>a+h.pv/h.pv0,0)/hs.length<0.7;const reserve=(G.tile==='t5'||G.tile==='t6')?(TUNE.resB??11):(TUNE.resA??15);
 if((avgE<0.6||hurtG)&&G.charge>reserve&&(G.aiRest||0)<(TUNE.restCap??4)){G.aiRest=(G.aiRest||0)+1;rest();return;}
 let dir=ex[0];if(ex.length>1){const ok=SIM.forceRoute?SIM.forceRoute==='detour':(hs.length>=4&&hs.every((h)=>h.pv>=0.6*h.pv0)&&G.charge>=18);dir=ok?'E':'N';log(ok?'Le groupe se sent fort : il prend le détour par la champignonnière.':'Le groupe préfère le raccourci par la saulaie.','story');}
 G.aiRest=0;advance(dir);}

const VID={on:false,cancel:false};
function frameImage(){return new Promise((res,rej)=>{const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="680" height="680">${boardSVG()}</svg>`;
 const img=new Image();img.onload=()=>res(img);img.onerror=rej;img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);});}
function wrapText(ctx,t,x,y,w,lh,max){const words=String(t).split(' ');let line='';let n=0;for(const wd of words){const test=line?line+' '+wd:wd;if(ctx.measureText(test).width>w&&line){ctx.fillText(line,x,y);y+=lh;line=wd;if(++n>=max)return y;}else line=test;}if(line){ctx.fillText(line,x,y);y+=lh;}return y;}
function paintFrame(ctx,img,prevLen){
 const W=1280,H=720;ctx.fillStyle='#0f1c16';ctx.fillRect(0,0,W,H);
 ctx.drawImage(img,20,20,680,680);
 const x=730;let y=58;ctx.fillStyle='#eaf3ec';ctx.font='700 30px Fraunces, Georgia, serif';ctx.fillText('Mission 1 · La Lisière',x,y);
 y+=36;ctx.font='600 22px Fraunces, Georgia, serif';ctx.fillStyle='#ffd97a';ctx.fillText(TILES[G.tile].name,x,y);
 y+=28;ctx.font='600 17px "Nunito Sans", sans-serif';ctx.fillStyle='#a9c2b3';ctx.fillText(G.mode==='combat'?`Combat · round ${G.round}`:'Exploration',x,y);
 y+=26;ctx.fillStyle='#24392f';ctx.fillRect(x,y,440,14);ctx.fillStyle='#f2c14b';ctx.fillRect(x,y,440*Math.max(0,Math.min(1,G.charge/30)),14);ctx.fillStyle='#f2c14b';ctx.font='800 17px "Nunito Sans", sans-serif';ctx.fillText(`🏮 ${Math.max(0,G.charge)}`,x+452,y+13);
 y+=40;heroes().forEach((h)=>{ctx.fillStyle=h.down?'#55665c':h.color;ctx.beginPath();ctx.arc(x+12,y-5,11,0,7);ctx.fill();ctx.fillStyle=h.down?'#7f8f86':'#eaf3ec';ctx.font='700 16px "Nunito Sans", sans-serif';ctx.fillText(`${h.name} · ${CLASSES[h.cls].n}`,x+32,y);
  ctx.fillStyle='#3a2a28';ctx.fillRect(x+260,y-12,140,9);ctx.fillStyle='#8fd694';ctx.fillRect(x+260,y-12,140*Math.max(0,h.pv)/h.pv0,9);ctx.fillStyle='#a9c2b3';ctx.font='600 14px "Nunito Sans", sans-serif';ctx.fillText(`${h.pv}/${h.pv0} · 💎${h.e}`,x+408,y-3);y+=30;});
 const cs=alive('c');y+=6;ctx.fillStyle='#e2675b';ctx.font='700 15px "Nunito Sans", sans-serif';ctx.fillText(cs.length?`Créatures : ${cs.length}`:'Aucune créature en vue',x,y);y+=30;
 ctx.fillStyle='#2c4a3c';ctx.fillRect(x,y-18,520,1);
 const lines=G.log.slice(Math.max(prevLen,G.log.length-7)).slice(-7);ctx.font='600 15px "Nunito Sans", sans-serif';
 lines.forEach((l,i)=>{ctx.fillStyle=l.cls==='bad'?'#e2675b':l.cls==='good'?'#8fd694':l.cls==='r'?'#ffd97a':l.cls==='story'?'#cfe3d6':'#eaf3ec';y=wrapText(ctx,l.t,x,y,520,20,2)+4;});
 if(G.over){ctx.fillStyle='rgba(5,10,8,.7)';ctx.fillRect(20,300,680,120);ctx.fillStyle=G.over==='victoire'?'#ffd97a':'#e2675b';ctx.font='700 46px Fraunces, Georgia, serif';ctx.textAlign='center';ctx.fillText(G.over==='victoire'?'Victoire !':'La mission échoue',360,375);ctx.textAlign='left';}}
async function exportVideo(){
 if(VID.on||!SIM.frames.length)return;
 if(!SIM.replay)startReplay();if(SIM.timer){clearTimeout(SIM.timer);SIM.timer=null;}
 const cv=document.createElement('canvas');cv.width=1280;cv.height=720;const ctx=cv.getContext('2d');
 const types=['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm','video/mp4'];const mime=types.find((t)=>window.MediaRecorder&&MediaRecorder.isTypeSupported(t));
 if(!mime||!cv.captureStream){log('Ce navigateur ne sait pas enregistrer de vidéo. Essaie avec Chrome ou Firefox.','bad');render();return;}
 VID.on=true;VID.cancel=false;const ext=mime.includes('mp4')?'mp4':'webm';
 const stream=cv.captureStream(30);const rec=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:3500000});const chunks=[];rec.ondataavailable=(e)=>{if(e.data&&e.data.size)chunks.push(e.data);};
 const done=new Promise((r)=>{rec.onstop=r;});
 try{await document.fonts?.ready;}catch(e){}
 const bar=$('simbar');const N=SIM.frames.length;rec.start(250);
 let prevLen=0;
 for(let i=0;i<N&&!VID.cancel;i++){
  const f=JSON.parse(SIM.frames[i]);const ll=f.log;f.log=SIM.fullLog.slice(0,ll);G=f;
  bar.hidden=false;bar.innerHTML=`<span class="lab">Export vidéo · action ${i+1} / ${N} · garde cet onglet ouvert et visible</span><button class="btn" data-sb="vcancel" type="button">Annuler</button>`;
  let img;try{img=await frameImage();}catch(e){continue;}
  const hold=(i===0||i===N-1)?1800:450;const t0=performance.now();
  while(performance.now()-t0<hold&&!VID.cancel){paintFrame(ctx,img,prevLen);await new Promise((r)=>setTimeout(r,90));}
  prevLen=Math.max(0,G.log.length-7);}
 rec.stop();await done;stream.getTracks().forEach((t)=>t.stop());VID.on=false;
 SIM.idx=N-1;showFrame(N-1);
 if(VID.cancel){log('Export vidéo annulé.','');render();return;}
 const blob=new Blob(chunks,{type:mime.split(';')[0]});
 const filename=`video-mission1-${heroes().length}heros-${G.over||'partie'}.${ext}`;
 const fallback=()=>{const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);};
 const cl=window.claude;
 if(cl&&cl.use){try{const dl=await cl.use('downloads');if(!dl)fallback();else{await dl.save({filename,data:blob});log('Vidéo enregistrée.','good');}}catch(e){log(e&&e.code==='declined'?'Enregistrement de la vidéo annulé.':'La vidéo n’a pas pu être enregistrée ici ('+(e&&e.code||'erreur')+').','bad');}}
 else fallback();
 render();}

/* Accès pour les tests automatisés : joue une partie complète sans affichage */
window.PG_HEADLESS=function(cfg,route){const keep=G;SIM.forceRoute=route||null;SIM.silent=true;SIM.auto=true;SIM.noSnap=true;newGame(cfg);let n=0;while(aiStep()&&n<5000)n++;
 const r={over:G.over||'bloque',cause:G.over==='victoire'?'':(alive('h').length?'lanterne':'heros'),charge:Math.max(0,G.charge),route:G.visited.t6?'detour':'raccourci',last:G.tile,
  down:heroes().filter((h)=>h.down).length,minR:G.stats.minR??1,close:G.stats.close||0,dmg:G.stats.dmgTaken||0,potions:heroes().reduce((a,h)=>a+(h.bag.includes('soin')?0:1),0),items:G.stats.items.length,secrets:G.stats.secrets,fights:G.stats.fights.map((f)=>[f.tile,f.rounds]),actions:n};
 SIM.silent=false;SIM.auto=false;SIM.noSnap=false;SIM.forceRoute=null;G=keep;return r;};
function showSummary(){
 const win=G.over==='victoire';const hs=heroes();const st=G.stats;
 const L=st.tiles[st.tiles.length-1];if(L&&L.out==null)L.out=Math.max(0,G.charge);
 const tileRows=st.tiles.map((t)=>{const f=st.fights.filter((x)=>x.tile===t.id);return `<tr><td>${esc(TILES[t.id].name)}</td><td>${t.inn} → ${t.out==null?'—':t.out}</td><td>${f.length?esc(f.map((x)=>x.rounds?x.rounds+' rounds':'en cours').join(', ')):'—'}</td><td>${f.length?esc([...new Set(f.flatMap((x)=>x.foes))].join(', ')):''}</td></tr>`;}).join('');
 const heroRows=hs.map((h)=>`<tr><td>${esc(h.name)}</td><td>${esc(CLASSES[h.cls].n)}</td><td>${h.down?'à terre':'debout ('+h.pv+'/'+h.pv0+')'}</td><td>${st.kills[h.id]||0}</td><td>${G.xp[h.id]}</td></tr>`).join('');
 $('dialog').innerHTML=`<h2>${win?'Victoire de la simulation':G.over==='arret'?'Simulation arrêtée':'La simulation échoue'}</h2>
 <p class="hint">${SIM.frames.length} actions jouées · charges restantes : ${Math.max(0,G.charge)} · objets trouvés : ${st.items.length} · secrets découverts : ${st.secrets}</p>
 <h3 style="margin-top:12px">Le parcours</h3><div style="overflow-x:auto"><table class="sumt"><thead><tr><th>Tuile</th><th>Lanterne</th><th>Combats</th><th>Créatures</th></tr></thead><tbody>${tileRows}</tbody></table></div>
 <h3 style="margin-top:12px">Les héros</h3><div style="overflow-x:auto"><table class="sumt"><thead><tr><th>Héros</th><th>Classe</th><th>Fin</th><th>Créatures vaincues</th><th>XP combats</th></tr></thead><tbody>${heroRows}</tbody></table></div>
 ${st.items.length?`<p class="hint">Objets : ${esc(st.items.join(', '))}</p>`:''}
 <div class="acts" style="margin-top:12px"><button type="button" class="btn main" id="rp2">Voir le replay action par action</button><button type="button" class="btn" id="dl2">Télécharger le replay<small>fichier .json à garder ou partager</small></button><button type="button" class="btn" id="vid2">Exporter en vidéo<small>WebM, environ ½ seconde par action</small></button><button type="button" class="btn" id="again2">Nouvelle partie</button></div>`;
 $('overlay').hidden=false;$('rp2').onclick=()=>{$('overlay').hidden=true;startReplay();};$('dl2').onclick=downloadReplay;$('vid2').onclick=()=>{$('overlay').hidden=true;exportVideo();};$('again2').onclick=()=>{stopSim();showSetup();};}

/* ================= Écrans ================= */
function showSetup(){
 const races=Object.keys(RACES),cls=Object.keys(CLASSES),fams=Object.keys(FAMS);
 const def=[['Aube','humain','rempart','tatou'],['Brin','marque','tisseur','panda'],['Cyr','oiseau','elementaliste','gecko'],['Dune','loutre','pisteur','hibou'],['Éole','astreen','lamesort','chacal']];
 const opt=(arr,M,v)=>arr.map((k)=>`<option value="${k}" ${k===v?'selected':''}>${esc(M[k].n)}</option>`).join('');
 let rows='';for(let i=0;i<5;i++){const d0=def[i];rows+=`<div class="srow" id="row${i}"><input id="nm${i}" value="${d0[0]}" maxlength="14" aria-label="Nom du héros ${i+1}"><select id="ra${i}" aria-label="Race">${opt(races,RACES,d0[1])}</select><select id="cl${i}" aria-label="Classe">${opt(cls,CLASSES,d0[2])}</select><select id="fa${i}" aria-label="Familier">${opt(fams,FAMS,d0[3])}</select></div>`;}
 $('dialog').innerHTML=`<h2>Préparer l’expédition</h2><p class="hint">Mission 1 de PoundaGame, version de test v0.2 : les règles figées de la bible, les dés lancés automatiquement. Tous les joueurs partagent cet écran.</p>
 <label style="display:flex;gap:10px;align-items:center;margin-top:10px">Nombre de héros <select id="nb" style="width:auto">${[2,3,4,5].map((n)=>`<option ${n===3?'selected':''}>${n}</option>`).join('')}</select></label>
 <div class="setup">${rows}</div><p class="hint">À 2 héros : +1 aux dégâts et +3 PV chacun. Chaque héros part avec 1 potion de soin et 1 potion de second souffle.</p>
 <div class="acts" style="margin-top:12px"><button type="button" class="btn main" id="go">Entrer dans le Voile</button><button type="button" class="btn" id="simfull">Simuler la partie<small>l’IA joue, tu regardes tout</small></button><button type="button" class="btn" id="simfast">Simulation rapide<small>résultat et résumé, puis replay</small></button><label class="btn" for="rpfile" style="cursor:pointer">Ouvrir un replay<small>fichier .json téléchargé</small></label><input type="file" id="rpfile" accept=".json,application/json" hidden></div><p class="hint" id="rperr"></p>`;
 $('overlay').hidden=false;
 const upd=()=>{const n=+$('nb').value;for(let i=0;i<5;i++)$('row'+i).hidden=i>=n;};$('nb').onchange=upd;upd();
 const cfgOf=()=>{const n=+$('nb').value;const cfg=[];for(let i=0;i<n;i++)cfg.push({name:$('nm'+i).value.trim()||('Héros '+(i+1)),race:$('ra'+i).value,cls:$('cl'+i).value,fam:$('fa'+i).value});return cfg;};
 $('go').onclick=()=>{stopSim();$('overlay').hidden=true;newGame(cfgOf());showIntro(()=>render());};
 $('simfull').onclick=()=>{$('overlay').hidden=true;startSim(cfgOf(),false);};
 $('simfast').onclick=()=>{$('overlay').hidden=true;startSim(cfgOf(),true);};
 $('rpfile').onchange=(ev)=>{const f=ev.target.files[0];if(f)loadReplay(f);};}
function showEnd(){
 const win=G.over==='victoire';const hs=heroes();
 const rows=hs.map((h)=>{const xp=G.xp[h.id]+(win&&!h.down?10:0)+(win?Math.max(0,G.charge):0);return `<tr><td>${esc(h.name)}</td><td>${h.down?'à terre':'debout'}</td><td>${G.xp[h.id]}</td><td>${win&&!h.down?10:0}</td><td>${win?Math.max(0,G.charge):0}</td><td><b>${xp}</b></td></tr>`;}).join('');
 $('dialog').innerHTML=`<h2>${win?'Victoire !':'La mission échoue'}</h2><p class="hint">${win?'Le Lumivore est vaincu et la Lisière respire à nouveau.':'La brume reprend ses droits… mais vous reviendrez.'} Charges restantes : ${Math.max(0,G.charge)}.</p>
 <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;margin-top:10px;font-size:14px"><thead><tr><th align="left">Héros</th><th align="left">État</th><th align="left">XP combats</th><th align="left">Mission</th><th align="left">Charges</th><th align="left">Total</th></tr></thead><tbody>${rows}</tbody></table></div>
 ${G.carnet.length?`<p class="hint">Carnet d’exploration : ${esc(G.carnet.map((c)=>c.nom+' (niveau '+c.niveau+' '+c.danger+')').join(' ; '))}</p>`:''}
 <p class="hint">XP provisoire : combats + 10 pour la mission réussie (héros debout) + 1 par charge restante.</p>
 <div class="acts" style="margin-top:12px"><button type="button" class="btn main" id="again">Nouvelle partie</button>${SIM.frames.length?'<button type="button" class="btn" id="rp">Voir le replay</button>':''}</div>`;
 $('overlay').hidden=false;$('again').onclick=()=>{stopSim();showSetup();};if($('rp'))$('rp').onclick=()=>{$('overlay').hidden=true;startReplay();};}

/* ================= Événements ================= */
$('board').addEventListener('click',(ev)=>{if(SIM.auto||SIM.replay)return;const r=$('board').getBoundingClientRect();const sc=500/r.width;const x=Math.floor(((ev.clientX-r.left)*sc-10)/60),y=Math.floor(((ev.clientY-r.top)*sc-10)/60);if(x<0||y<0||x>7||y>7)return;clickCell(x,y);});
document.addEventListener('keydown',(ev)=>{if(ev.key==='Escape'&&G&&G.pending){G.pending=null;render();}});
$('roster').addEventListener('click',(ev)=>{const el=ev.target.closest('[data-hero]');if(!el||!G||G.mode!=='explore')return;const h=byId(el.dataset.hero);if(h&&!h.down){G.sel=h.id;render();}});
$('active').addEventListener('click',(ev)=>{const b=ev.target.closest('button[data-act]');if(!b||b.disabled||!G||G.over)return;const act=b.dataset.act;const h=curHero();
 if(act==='move'){setPending({type:'move',cells:reach(h,h.mv+(h.light?1:0))});return;}
 if(act.startsWith('sp:')){const sid=act.slice(3);const S=SP[sid];if(S.t==='self'){castSpell(h,sid,h);return;}setPending({type:'spell',sid,targets:targetsFor(h,S,sid)});return;}
 if(act==='fam'){setPending({type:'fam',targets:famTargets(h)});return;}
 if(act==='atout'){useAtout(h);return;}
 if(act.startsWith('item:')){useItem(h,act.slice(5));return;}
 if(act==='end'){G.pending=null;nextHero();render();return;}
 if(act==='search'){doSearch(h,false);return;}
 if(act==='gecko'){doSearch(h,true);return;}
 if(act.startsWith('peek:')){const dd=act.slice(5);const to=TILES[tile().exits[dd]];h.free=false;
  const what={ruines:'des chenilles et une Phalène',saulaie:'une brume épaisse et un battement d’ailes',champi:'des champignons qui crachent… et des fleurs qui brillent',boss:'une lumière dorée immobile au-dessus d’une mare'}[to.fight]||'rien de vivant';
  G.peek=`Le Hibou survole le ${DIRN[dd]} : ${to.name}, ${what}.`;log(G.peek,'story');render();return;}
 if(act==='altar'){h.free=false;if(G.tile==='t1'){G.altarT1=true;log('La borne s’allume une dernière fois : « Explorateurs, le Lumignon est votre souffle. Ne la laissez pas mourir. »','story');}
  else{G.altar=true;log('L’autel s’éveille : deux chemins apparaissent. Au nord, une saulaie noyée de brume (plus court). À l’est, une champignonnière où brillent des fleurs (plus long, plus dangereux, plus riche).','story');}render();return;}
 if(act==='flower'){h.free=false;G.flowers++;G.charge+=2;log(`${h.name} cueille une fleur-lanterne : +2 charges.`,'good');render();return;}
 if(act==='heal'){const t=alive('h').slice().sort((a,b)=>a.pv/a.pv0-b.pv/b.pv0)[0];h.e--;h.free=false;const v=d(6);t.pv=Math.min(t.pv0,t.pv+v);log(`${h.name} tisse un Lien de vie vers ${t.name} : +${v} PV.`,'good');render();return;}
 if(act.startsWith('go:')){advance(act.slice(3));return;}
 if(act==='rest'){rest();return;}});
$('newgame').onclick=()=>{stopSim();showSetup();};
$('legend').innerHTML=[['#2f5b3a','Arbre, rocher, mur : bloquent'],['#6fa25a','Fougères : −2 aux tirs contre toi'],['#8a6a45','Racines : 2 cases'],['#7fb8d6','Eau peu profonde : 2 cases'],['#3f7fa8','Eau profonde : infranchissable'],['#c9a24a','? Fouille'],['#f2c14b','Sortie / fleur ✿']].map(([c,t])=>`<span><i class="sw" style="background:${c}"></i>${t}</span>`).join('');
function start(data){if(data&&data.units){G=data;render();}else showSetup();}
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
}
